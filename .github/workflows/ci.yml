name: Go API checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PONDLY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      PONDLY_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.mod
      - run: gofmt -l . | tee /tmp/gofmt.out; test ! -s /tmp/gofmt.out
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/...
      - name: Install PostgreSQL 16 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
      - name: Verify backup and restore against PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          source_url="${PONDLY_TEST_DATABASE_URL%/*}/pondly_backup_source?sslmode=disable"
          target_url="${PONDLY_TEST_DATABASE_URL%/*}/pondly_backup_target?sslmode=disable"
          psql "$PONDLY_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE pondly_backup_source'
          psql "$PONDLY_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE pondly_backup_target'
          psql "$source_url" -v ON_ERROR_STOP=1 -c 'CREATE TABLE probe (id integer); INSERT INTO probe VALUES (42)'
          export PONDLY_BACKUP_DIR="$(mktemp -d)"
          PONDLY_DATABASE_URL="$source_url" bash ../../infra/backup.sh
          dumps=("$PONDLY_BACKUP_DIR"/*.dump)
          export PONDLY_RESTORE_CONFIRM=yes PONDLY_RESTORE_DATABASE_URL="$target_url"
          bash ../../infra/restore.sh "${dumps[0]}"
          test "$(psql "$target_url" -Atc 'SELECT id FROM probe')" = 42
          printf 'corruption' >> "${dumps[0]}"
          if bash ../../infra/restore.sh "${dumps[0]}"; then exit 1; fi

  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python SDK tests
        run: python -m unittest discover -s integrations/python-sdk -p 'test_*.py' -v
      - name: Runner tests
        run: python -m unittest discover -s integrations/runner -p 'test_*.py' -v
      - name: Security boundary tests
        run: python -m unittest discover -s integrations/security -p 'test_*.py' -v
      - name: Compile integration sources
        run: python -m compileall -q integrations

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenAPI JSON structure, refs and auth
        run: python3 scripts/validate_contract.py
      - name: Install pinned OpenAPI 3.1 validator
        run: python3 -m pip install --disable-pip-version-check 'openapi-spec-validator==0.7.2'
      - name: Validate OpenAPI 3.1 semantics
        run: python3 -c "import json; from openapi_spec_validator import validate; validate(json.load(open('contracts/openapi.json',encoding='utf-8')))"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate contract types and require the committed copy to match
        run: |
          python3 scripts/generate_contract_types.py
          git diff --exit-code contracts/generated/api.d.ts

  release-bundle:
    needs: [api, integrations, web, contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build API binaries
        working-directory: apps/api
        run: |
          mkdir -p ../../bundle/bin
          go build -trimpath -o ../../bundle/bin/ ./cmd/...
      - name: Build standalone web
        working-directory: apps/web
        run: |
          npm ci
          npm run build
          cp -a .next/standalone ../../bundle/web
          cp -a .next/static ../../bundle/web/.next/static
          if [ -d public ]; then cp -a public ../../bundle/web/public; fi
      - name: Package deployment files
        run: |
          cp -a db infra bundle/
          printf 'commit=%s\nbuilt_at=%s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > bundle/BUILD_INFO
          archive="pondly-$GITHUB_SHA-linux-amd64.tar.gz"
          tar -czf "$archive" -C bundle .
          sha256sum "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: pondly-${{ github.sha }}-linux-amd64
          path: |
            pondly-*.tar.gz
            pondly-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
