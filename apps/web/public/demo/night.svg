<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a282b"/>
      <stop offset=".55" stop-color="#123b3d"/>
      <stop offset="1" stop-color="#071518"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".22" r=".7">
      <stop offset="0" stop-color="#b9efe0" stop-opacity=".8"/>
      <stop offset=".35" stop-color="#63b6a6" stop-opacity=".25"/>
      <stop offset="1" stop-color="#123b3d" stop-opacity="0"/>
